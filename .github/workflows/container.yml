name: builder-container

on:
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: builder

jobs:
  build-and-push-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Tag name
        id: tag_name
        run: |
          # Strip git ref prefix from version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [ "$VERSION" == "master" ] && TAG=latest
          [ "$VERSION" == "ci" ] && TAG=test
          [ "$VERSION" == "merge" ] && TAG=test

          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Build image
        id: build
        run: |
          TAG="${{ steps.tag_name.outputs.TAG }}"
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME
          docker build .github/ --file .github/Dockerfile.ubuntu-24.04 --tag $IMAGE_ID:$TAG --label "runnumber=${GITHUB_RUN_ID}"
          echo "image=$IMAGE_ID:$TAG" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Push image
        run: docker push ${{ steps.build.outputs.image }}
